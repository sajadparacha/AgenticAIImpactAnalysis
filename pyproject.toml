[project]
name = "oracle-impact"
version = "1.0.0"
description = "Evidence-based Oracle PL/SQL impact analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "oracledb>=2.5",
    "httpx>=0.27",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63"]
dev = ["pytest>=8.3", "pypdf>=5.1"]

[project.scripts]
oracle-impact = "oracle_impact.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oracle_impact = ["views/templates/*.html", "views/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
