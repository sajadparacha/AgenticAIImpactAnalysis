<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Oracle package impact analysis{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <div>
        <p class="eyebrow">Impact analysis</p>
        <a class="wordmark" href="/">Oracle package impact analysis</a>
      </div>
      <nav class="mast-nav">
        <a href="/">Dashboard</a>
        <form method="post" action="/logout">
          <button type="submit" class="linkish">Sign out</button>
        </form>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
