{% macro crumbs(items) -%}
<nav class="crumbs" aria-label="Breadcrumb">
  <ol>
    {% for item in items %}
    <li{% if loop.last %} aria-current="page"{% endif %}>{% if item.href and not loop.last %}<a href="{{ item.href }}">{{ item.label }}</a>{% else %}<span{% if item.title %} title="{{ item.title }}"{% endif %}>{{ item.label }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
{%- endmacro %}
